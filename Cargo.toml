[package]
name = "ipcv"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
flume = "0.12.0"
futures = "0.3.34"
hostname = "0.4.2"
humantime = "2.4.0"
iced = { version = "0.15.0-dev", features = ["image", "svg", "tokio"] }
image = "0.25.10"
indexmap = "2.14.2"
itertools = "0.15.0"
jiff = "0.2.39"
local-ip-address = "0.6.13"
lucide-icons = { version = "1.45.0" }
nokhwa = { version = "0.10.11", features = ["input-native", "output-threaded"] }
open = "5.4.4"
rust-fontconfig = { version = "5.0.2", features = ["parsing"] }
send_ctrlc = "0.6.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec", "net"] }

[target."cfg(unix)".dependencies]
termios = "0.3.3"

[patch.crates-io]
iced.git = "https://github.com/iced-rs/iced.git"
iced.rev = "8ff48c42b0d5188223501ea1ccc506fd5beaf36a"
